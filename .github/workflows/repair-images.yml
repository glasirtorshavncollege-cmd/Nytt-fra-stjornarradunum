name: Dagfør myndir í PWA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ministry-check
  cancel-in-progress: false

jobs:
  repair:
    name: Heinta myndir uttan fráboðanir
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update image metadata in feed
        run: python monitor.py --repair-feed-images
      - name: Save updated feed only
        run: |
          git config user.name "ministry-watch-bot"
          git config user.email "actions@github.com"
          git add docs/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Add official article images to PWA feed"
            git push
          fi
