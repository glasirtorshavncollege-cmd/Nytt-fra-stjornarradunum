name: Nýtt frá stjórnarráðunum

on:
  schedule:
    # Koyrir eina ferð um dagin kl. 06:30 UTC.
    # Tað er vanliga 07:30 føroyska tíð um veturin og 07:30/06:30 eftir uppseting og summar-/vetrartíð.
    - cron: "30 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        run: python monitor.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: samskifti@glasir.fo

      - name: Commit updated state
        run: |
          git config user.name "ministry-watch-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update ministry watch state"
          git push
