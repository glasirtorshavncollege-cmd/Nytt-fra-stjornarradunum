name: Nýtt frá stjórnarráðunum
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * *'
    - cron: '30 10 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: ministry-check
  cancel-in-progress: false
jobs:
  status:
    name: Commit status
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile monitor.py push_sender.py
  check:
    name: Daily ministry check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run monitor
        run: python monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit state and feed
        id: commit
        run: |
          git config user.name "ministry-watch-bot"
          git config user.email "actions@github.com"
          git add state.json docs/feed.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update ministry watch state and feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Optional push for newly published articles
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          python -m pip install pywebpush
          python push_sender.py
        env:
          PUSH_ENABLED: ${{ secrets.PUSH_ENABLED }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS_JSON: ${{ secrets.PUSH_SUBSCRIPTIONS_JSON }}
          PUSH_VAPID_CONTACT: ${{ secrets.PUSH_VAPID_CONTACT }}
