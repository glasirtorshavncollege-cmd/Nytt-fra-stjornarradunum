
name: Kanna VAPID-lyklar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cryptography
        run: python -m pip install cryptography

      - name: Compare VAPID public keys
        env:
          PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os, json, base64, hmac
          from cryptography.hazmat.primitives import serialization

          def decode(value):
              return base64.urlsafe_b64decode(value + "=" * (-len(value) % 4))

          def encode(value):
              return base64.urlsafe_b64encode(value).decode().rstrip("=")

          private = os.environ.get("PRIVATE_KEY", "").strip()
          if not private:
              raise SystemExit("ERROR: Private VAPID key missing")

          key = serialization.load_der_private_key(
              decode(private), password=None
          )
          derived_public = encode(key.public_key().public_bytes(
              encoding=serialization.Encoding.X962,
              format=serialization.PublicFormat.UncompressedPoint
          ))

          with open("docs/push-config.json", encoding="utf-8") as f:
              configured_public = json.load(f)["publicKey"].strip()

          if hmac.compare_digest(derived_public, configured_public):
              print("OK: VAPID keys MATCH")
          else:
              raise SystemExit("ERROR: VAPID keys DO NOT MATCH")
          PY
