
name: Nýtt frá stjórnarráðunum

on:
  push:
    branches:
      - main

  schedule:
    # Koyrir tríggjar ferðir um dagin (UTC).
    - cron: "30 6 * * *"
    - cron: "30 10 * * *"
    - cron: "30 14 * * *"

  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ministry-check
  cancel-in-progress: false

jobs:
  status:
    name: Commit status
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile monitor.py

  check:
    name: Daily ministry check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        run: |
          if [ "$GITHUB_REF_NAME" = "ministry-check-pwa" ]; then
            echo "PWA test: update feed without notifications"
            python monitor.py --backfill-feed
          else
            echo "Production: normal ministry check"
            python monitor.py
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated state and feed
        run: |
          git config user.name "ministry-watch-bot"
          git config user.email "actions@github.com"
          git add state.json docs/feed.json
          git diff --cached --quiet || git commit -m "Update ministry watch state and feed"
          git push
