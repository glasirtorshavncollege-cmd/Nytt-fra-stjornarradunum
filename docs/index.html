<!doctype html>
<html lang="fo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17385b"><meta name="description" content="Tíðindi frá føroyskum stjórnarráðum"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Nýtt frá stjórnarráðunum</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#162c40;background:#f7f8fb}*{box-sizing:border-box}body{margin:0}header{background:#17385b;color:#fff;padding:24px max(20px,calc((100vw - 900px)/2))}h1{font-size:clamp(1.4rem,4vw,2rem);margin:0 0 6px}header p{margin:0;color:#d5e4ef}main{max-width:900px;margin:auto;padding:24px 18px 80px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.toolbar input,.toolbar select,.toolbar button{width:100%;border:1px solid #cdd7df;border-radius:10px;font:inherit;padding:12px;background:white;color:#162c40}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 25px}.actions button{border:1px solid #b2c5d1;border-radius:8px;padding:9px 13px;background:#fff;color:#17385b;cursor:pointer}.status{color:#556a7a;font-size:.88rem;margin-left:auto}.item{background:white;border:1px solid #e1e6ed;border-radius:14px;padding:20px;margin:0 0 14px;box-shadow:0 2px 8px #1d34430b}.meta{color:#52748b;font-size:.85rem;margin-bottom:8px}.item h2{margin:0 0 10px;font-size:1.14rem;line-height:1.38}.item p{line-height:1.5;color:#374b5c}.item a{color:#145b83;text-decoration:underline;text-underline-offset:3px}.pill{display:inline-block;background:#dff2e9;color:#206244;font-size:.73rem;border-radius:30px;padding:3px 8px;margin-left:6px}.item.read{opacity:.7}.itemfooter{display:flex;align-items:center;justify-content:space-between;gap:10px}.itemfooter button{border:1px solid #cdd7df;background:white;border-radius:8px;padding:8px;cursor:pointer;color:#17385b}.empty{padding:32px 20px;background:white;border-radius:12px;border:1px solid #e1e6ed;text-align:center;color:#526575}.footnote{color:#5b6e7a;font-size:.85rem;margin-top:20px}label{display:block;font-size:.85rem;margin-bottom:5px;color:#354d60}@media(max-width:540px){.toolbar{grid-template-columns:1fr}main{padding-top:16px}.status{width:100%;margin-left:0}}
</style></head><body><header><h1>Nýtt frá stjórnarráðunum</h1><p>Ministry Check · føroyskt tíðindayvirlit</p></header><main><div class="toolbar"><div><label for="search">Leita í tíðindum</label><input type="search" id="search" placeholder="Leita eftir orði…"></div><div><label for="source">Vel keldu</label><select id="source"><option value="">Allar keldur</option></select></div></div><div class="actions"><button id="unread" type="button" aria-pressed="false">Vís bert ólisnar</button><button id="refresh" type="button">Dagfør</button><span class="status" id="status" role="status" aria-live="polite">Lesi tíðindi…</span></div><section id="items" aria-label="Tíðindayvirlit"></section><p class="footnote">Tíðindi verða savnað frá almennum heimasíðum. Merkingar av lisnum tíðindum verða goymdar á hesum tólinum, ikki á GitHub. Push-fráboðanir eru ikki virknar í hesi fyrstu útgávuni.</p></main><script>
const $=id=>document.getElementById(id), state={items:[],unread:false};
const storageKey='ministry-check-read-v1';
function getRead(){try{return new Set(JSON.parse(localStorage.getItem(storageKey)||'[]'))}catch{return new Set()}}
function setRead(read){try{localStorage.setItem(storageKey,JSON.stringify([...read].slice(-1000)))}catch{}}
function dateText(iso){if(!iso)return '';const d=new Date(iso);return Number.isNaN(+d)?'':new Intl.DateTimeFormat('fo-FO',{day:'numeric',month:'short',year:'numeric'}).format(d)}
function render(){const q=$('search').value.trim().toLocaleLowerCase(),source=$('source').value,read=getRead();const filtered=state.items.filter(x=>(!source||x.source===source)&&(!state.unread||!read.has(x.id))&&(!q||[x.title,x.summary,x.source].join(' ').toLocaleLowerCase().includes(q)));const root=$('items');root.replaceChildren();if(!filtered.length){const e=document.createElement('p');e.className='empty';e.textContent=state.items.length?'Eingi tíðindi passa til valdu filtrini.':'Enn eru eingi tíðindi í appini. Nýggj tíðindi verða løgd inn eftir næstu GitHub-kanning.';root.append(e);return}for(const x of filtered){const card=document.createElement('article');card.className='item'+(read.has(x.id)?' read':'');const meta=document.createElement('div');meta.className='meta';meta.textContent=x.source+(x.found_at?' · Funnið '+dateText(x.found_at):'');if(!read.has(x.id)){const b=document.createElement('span');b.className='pill';b.textContent='Ólisið';meta.append(b)}const h=document.createElement('h2');h.textContent=x.title;const desc=document.createElement('p');desc.textContent=x.summary||'';const foot=document.createElement('div');foot.className='itemfooter';const link=document.createElement('a');link.href=x.url;link.textContent='Les upprunagrein';link.target='_blank';link.rel='noopener noreferrer';const btn=document.createElement('button');btn.type='button';btn.textContent=read.has(x.id)?'Merk sum ólisið':'Merk sum lisið';btn.onclick=()=>{const r=getRead();r.has(x.id)?r.delete(x.id):r.add(x.id);setRead(r);render()};foot.append(link,btn);card.append(meta,h,desc,foot);root.append(card)}}
async function load(){ $('status').textContent='Dagføri…';try{const response=await fetch('./feed.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data))throw Error('Óvæntað dátusnið');state.items=data.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&typeof x.url==='string'&&/^https:\/\//.test(x.url)&&typeof x.source==='string').sort((a,b)=>(b.found_at||'').localeCompare(a.found_at||''));const old=$('source').value;const names=[...new Set(state.items.map(x=>x.source))].sort((a,b)=>a.localeCompare(b,'fo'));$('source').replaceChildren(new Option('Allar keldur',''),...names.map(n=>new Option(n,n)));$('source').value=names.includes(old)?old:'';$('status').textContent=state.items.length+' tíðindi í yvirlitinum';render()}catch(e){$('status').textContent='Kundi ikki lesa tíðindi. Royn aftur.';render()}}
$('search').addEventListener('input',render);$('source').addEventListener('change',render);$('refresh').addEventListener('click',load);$('unread').addEventListener('click',()=>{state.unread=!state.unread;$('unread').setAttribute('aria-pressed',String(state.unread));$('unread').textContent=state.unread?'Vís øll tíðindi':'Vís bert ólisnar';render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});load();
</script></body></html>
