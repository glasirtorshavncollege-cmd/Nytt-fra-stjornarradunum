<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17385b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Tíðindi frá føroyskum stjórnarráðum og almennum stovnum">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Nýtt frá stjórnarráðunum</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19344a;background:#f6f8fb;color-scheme:light}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #8cb8ee;outline-offset:3px}header{background:#17385b;color:white;padding:27px 22px 25px}.headinner{max-width:760px;margin:0 auto}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.69rem;font-weight:750;color:#b9d3e9;margin-bottom:8px}h1{font-size:clamp(1.55rem,4.8vw,2rem);line-height:1.16;margin:0;font-weight:780;letter-spacing:-.035em}.subtitle{margin:9px 0 0;color:#d1e0ee;font-size:.92rem}main{max-width:804px;padding:23px 22px 80px;margin:auto}.searchbox{position:relative}.searchbox svg{position:absolute;top:15px;left:15px;color:#6c8194;pointer-events:none}.searchbox input{display:block;width:100%;padding:13px 16px 13px 47px;border:1px solid #d7e0e8;border-radius:13px;min-height:51px;background:white;color:#19344a;box-shadow:0 2px 10px rgba(26,49,69,.03);font-size:1rem}.searchbox input::placeholder{color:#71869a}.filterlabel{margin:22px 0 11px;font-size:.79rem;font-weight:750;color:#53697d}.chips{display:flex;gap:8px;overflow-x:auto;padding:1px 1px 9px;scrollbar-width:thin}.chip{white-space:nowrap;border-radius:999px;background:white;border:1px solid #d7e0e8;color:#36536c;padding:8px 13px;font-size:.83rem;font-weight:600;min-height:36px}.chip[aria-pressed="true"]{background:#17385b;border-color:#17385b;color:#fff}.feedtop{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e2e8ef;margin-top:16px;padding:0 0 13px}.feedtop h2{font-size:1rem;margin:0;letter-spacing:-.01em}.feedactions{display:flex;align-items:center;gap:10px}.textbtn{border:0;background:transparent;color:#23608a;padding:4px;font-size:.8rem;font-weight:650}.count{font-size:.79rem;color:#647b8f;white-space:nowrap}.list{display:flex;flex-direction:column;gap:10px;padding-top:14px}.news{border:1px solid #e0e7ee;background:#fff;border-radius:14px;box-shadow:0 3px 14px rgba(31,56,79,.035);overflow:hidden}.news.read{background:#fbfcfd}.toggle{display:block;background:transparent;width:100%;border:0;text-align:left;padding:17px 18px 16px;color:inherit}.newsmeta{display:flex;flex-wrap:wrap;gap:5px 7px;align-items:center;color:#59738a;font-size:.77rem;margin-bottom:8px}.dot{color:#a5b4c0}.unreadmark{display:inline-block;width:7px;height:7px;background:#2c90c2;border-radius:50%}.headline{display:flex;align-items:start;gap:12px}.headline strong{flex:1;font-size:1rem;line-height:1.42;letter-spacing:-.012em;font-weight:740}.chevron{flex:none;margin-top:3px;color:#748ba0;transition:transform .15s ease}.news.open .chevron{transform:rotate(180deg)}.details{display:none;padding:0 18px 18px}.news.open .details{display:block}.details p{margin:0 0 16px;color:#415a6e;line-height:1.6;font-size:.9rem}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.origin{color:#125e90;font-size:.86rem;font-weight:700;text-decoration:none}.origin:hover{text-decoration:underline}.readbtn{border:1px solid #d5e0e9;background:#f9fbfd;border-radius:8px;color:#426278;font-size:.79rem;padding:8px 10px}.empty{margin:15px 0;border:1px solid #e0e7ee;border-radius:13px;background:white;padding:25px;color:#587084;text-align:center;font-size:.9rem}.note{margin:24px 0;color:#6a7f90;font-size:.75rem;line-height:1.5}.error{color:#a23431}@media(max-width:600px){header{padding:24px 19px 22px}main{padding:18px 15px 75px}.feedtop{align-items:flex-start}.feedactions{gap:5px}.newsmeta{font-size:.74rem}.toggle{padding:15px}.details{padding:0 15px 16px}.headline strong{font-size:.975rem}.count{font-size:.73rem}}
</style>
</head>
<body>
<header><div class="headinner"><div class="eyebrow">Ministry Check</div><h1>Nýtt frá stjórnarráðunum</h1><p class="subtitle">Tíðindi úr almennum føroyskum keldum</p></div></header>
<main>
  <div class="searchbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="search" type="search" placeholder="Leita í tíðindum…" aria-label="Leita í tíðindum" autocomplete="off"></div>
  <div class="filterlabel">Vel stjórnarráð ella keldu</div>
  <nav id="chips" class="chips" aria-label="Filtrera eftir keldu"><button type="button" class="chip" aria-pressed="true">Øll</button></nav>
  <div class="feedtop"><h2>Seinastu tíðindi</h2><div class="feedactions"><button class="textbtn" id="unread" type="button" aria-pressed="false">Bert ólisnar</button><button class="textbtn" id="refresh" type="button">Dagfør</button><span class="count" id="status" role="status" aria-live="polite">Lesi…</span></div></div>
  <section id="items" class="list" aria-label="Tíðindi"></section>
  <p class="note">Tíðindi eru savnað frá almennum keldum. Lisin tíðindi verða merkt á hesum tólinum. Push-fráboðanir eru ikki virknar enn.</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const state={items:[],source:'',unread:false,open:new Set()};
const storageKey='ministry-check-read-v1';
function getRead(){try{return new Set(JSON.parse(localStorage.getItem(storageKey)||'[]'))}catch{return new Set()}}
function saveRead(read){try{localStorage.setItem(storageKey,JSON.stringify([...read].slice(-1000)))}catch{}}
function dateText(iso){if(!iso)return '';const d=new Date(iso);return Number.isNaN(+d)?'':new Intl.DateTimeFormat('fo-FO',{day:'numeric',month:'short',year:'numeric'}).format(d)}
function effectiveDate(x){return x.published_at||x.found_at||''}
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function drawChips(){const root=$('chips');root.replaceChildren();const sources=['',...[...new Set(state.items.map(x=>x.source))].sort((a,b)=>a.localeCompare(b,'fo'))];for(const source of sources){const button=node('button','chip',source||'Øll');button.type='button';button.setAttribute('aria-pressed',String(state.source===source));button.addEventListener('click',()=>{state.source=source;drawChips();render()});root.append(button)}}
function render(){const q=$('search').value.trim().toLocaleLowerCase('fo');const read=getRead();const visible=state.items.filter(x=>(!state.source||x.source===state.source)&&(!state.unread||!read.has(x.id))&&(!q||[x.title,x.summary,x.source].join(' ').toLocaleLowerCase('fo').includes(q)));const root=$('items');root.replaceChildren();if(!visible.length){root.append(node('p','empty',state.items.length?'Eingi tíðindi passa til valdu filtrini.':'Enn eru eingi tíðindi í appini.'));return}for(const x of visible){const isRead=read.has(x.id),isOpen=state.open.has(x.id);const article=node('article','news'+(isRead?' read':'')+(isOpen?' open':''));const toggle=node('button','toggle');toggle.type='button';toggle.setAttribute('aria-expanded',String(isOpen));toggle.setAttribute('aria-label',x.title+'. '+(isOpen?'Lat aftur':'Vís samandrátt'));toggle.addEventListener('click',()=>{isOpen?state.open.delete(x.id):state.open.add(x.id);render()});const meta=node('div','newsmeta');if(!isRead)meta.append(node('span','unreadmark'));meta.append(node('span','',x.source));meta.append(node('span','dot','·'));meta.append(node('span','',x.published_at?'Útgivið '+dateText(x.published_at):'Funnið '+dateText(x.found_at)));const headline=node('div','headline');headline.append(node('strong','',x.title));const chevron=node('span','chevron');chevron.textContent='⌄';chevron.setAttribute('aria-hidden','true');headline.append(chevron);toggle.append(meta,headline);article.append(toggle);const details=node('div','details');const para=node('p','',x.summary||'Eingin samandráttur er tøkur.');const foot=node('div','foot');const link=node('a','origin','Les upprunagrein');link.href=x.url;link.target='_blank';link.rel='noopener noreferrer';const mark=node('button','readbtn',isRead?'Merk sum ólisið':'Merk sum lisið');mark.type='button';mark.addEventListener('click',()=>{const r=getRead();r.has(x.id)?r.delete(x.id):r.add(x.id);saveRead(r);render()});foot.append(link,mark);details.append(para,foot);article.append(details);root.append(article)}}
async function load(){const status=$('status');status.textContent='Dagføri…';try{const response=await fetch('./feed.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data))throw Error('Óvæntað dátusnið');state.items=data.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&typeof x.source==='string'&&typeof x.url==='string'&&/^https:\/\//.test(x.url)).sort((a,b)=>effectiveDate(b).localeCompare(effectiveDate(a)));status.textContent=state.items.length+' tíðindi';drawChips();render()}catch(error){status.textContent='Villa í innlestri';status.classList.add('error');if(!state.items.length)$('items').replaceChildren(node('p','empty','Kundi ikki lesa tíðindini. Royn aftur.'))}}
$('search').addEventListener('input',render);
$('refresh').addEventListener('click',load);
$('unread').addEventListener('click',()=>{state.unread=!state.unread;const btn=$('unread');btn.setAttribute('aria-pressed',String(state.unread));btn.textContent=state.unread?'Vís øll':'Bert ólisnar';render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
load();
</script>
</body>
</html>
