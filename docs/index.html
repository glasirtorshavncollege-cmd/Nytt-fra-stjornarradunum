<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073f85"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Nýtt frá stjórnarráðunum – føroyskt tíðindayvirlit">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Nýtt frá ráðunum</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111c30;background:#f6f8fc;color-scheme:light;--navy:#073e80;--blue:#064b9d;--muted:#64748b;--line:#e5ebf2}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #70b9ff;outline-offset:3px}.shell{width:100%;max-width:980px;margin:0 auto;min-height:100dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}header{background:linear-gradient(115deg,#07376f 0%,#064a9e 70%,#063b7e 100%);color:white;position:relative;z-index:4;box-shadow:0 3px 16px #002d6a14}.head{min-height:88px;max-width:980px;margin:auto;display:flex;align-items:center;gap:14px;padding:18px 19px}.emblem{height:42px;width:42px;border:1.5px solid #dcecff;border-radius:12px;display:grid;place-items:center;flex:none}.emblem svg{height:25px;width:25px}.heading{flex:1;min-width:0;font-weight:760;font-size:clamp(1.24rem,5vw,1.55rem);letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.iconbtn{border:0;background:transparent;color:inherit;display:grid;place-items:center;border-radius:10px;width:43px;height:43px;flex:none}.iconbtn svg{width:25px;height:25px;stroke-width:2.2}.view[hidden],.searchrow[hidden],.modal[hidden]{display:none!important}.searchrow{padding:0 17px 15px;max-width:980px;margin:auto}.searchrow input{width:100%;height:45px;border-radius:12px;border:1px solid #bfd4e9;padding:0 15px;background:white;color:#152439}.body{padding:19px 18px 34px;max-width:920px;margin:0 auto}.filters{display:flex;gap:8px;overflow-x:auto;padding:3px 2px 14px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{border:0;border-radius:28px;background:#e9eef5;color:#19212b;font-weight:700;padding:10px 18px;min-height:40px;white-space:nowrap}.chip[aria-pressed=true]{background:#0751a6;color:white;box-shadow:0 3px 8px #044c9d27}.summaryline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 3px 13px;color:#687b92;font-size:.78rem}.summaryline strong{font-size:.93rem;color:#253954}.summaryline button{border:0;color:#0751a6;background:transparent;font-weight:650}.cards{display:flex;flex-direction:column;gap:12px}.card{background:#fff;border-radius:18px;border:1px solid #e9edf3;box-shadow:0 5px 15px #152b4c0a;overflow:hidden}.cardbutton{border:0;display:grid;grid-template-columns:115px minmax(0,1fr) 17px;align-items:center;gap:12px;text-align:left;color:inherit;padding:12px;width:100%;background:transparent;min-height:124px}.thumb{width:115px;height:106px;border-radius:13px;background:#e9f0f8;display:grid;place-items:center;overflow:hidden;color:#8aa4c1}.thumb svg{width:47px;height:47px;opacity:.88}.thumb img{width:100%;height:100%;object-fit:cover}.cardbody{min-width:0;align-self:center}.sourcepill{display:inline-block;border-radius:999px;background:#e1ebff;color:#164b89;font-size:.69rem;line-height:1.2;font-weight:700;padding:6px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sourcepill[data-hue="1"]{background:#e7d7f5;color:#563a7a}.sourcepill[data-hue="2"]{background:#d9f1f3;color:#24646e}.sourcepill[data-hue="3"]{background:#e8f0d4;color:#4d6128}.sourcepill[data-hue="4"]{background:#f9e7d5;color:#8a5530}.card h2{font-size:1.01rem;font-weight:760;line-height:1.28;letter-spacing:-.025em;margin:7px 0 9px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.when{color:#64748b;font-size:.83rem}.arrow{font-size:1.75rem;color:#1d3452}.detail{background:white;min-height:calc(100dvh - 88px);max-width:780px;margin:0 auto;padding:30px 24px 45px}.detail h1{font-size:clamp(1.75rem,6vw,2.5rem);line-height:1.12;letter-spacing:-.04em;margin:19px 0 20px;color:#070b12}.detail .when{font-size:1rem}.hero{margin:25px 0 21px;border-radius:15px;height:220px;overflow:hidden;display:grid;place-items:center;background:#e9f0f8;color:#8aa4c1}.hero img{width:100%;height:100%;object-fit:cover}.hero svg{width:85px;height:85px;opacity:.8}.detail p{font-size:1.04rem;line-height:1.7;color:#1e293b;margin:0 0 24px;white-space:pre-wrap}.primary{display:flex;align-items:center;justify-content:center;gap:12px;min-height:54px;background:#0751a6;color:#fff;text-decoration:none;border-radius:13px;font-weight:750;padding:14px 16px;text-align:center}.primary svg{width:19px;height:19px}.secondary{margin-top:14px;background:#edf4fb;color:#064b9d;border:0;border-radius:12px;min-height:45px;width:100%;font-weight:700}.empty{border:1px solid var(--line);border-radius:16px;padding:30px 16px;background:white;text-align:center;color:#61718a;line-height:1.5}.footnote{color:#728098;font-size:.75rem;line-height:1.5;margin:18px 5px}.modal{position:fixed;inset:0;z-index:10;background:#0b1e37a0;display:flex;align-items:flex-end;justify-content:center}.modalcontent{background:white;border-radius:22px 22px 0 0;padding:22px 22px calc(28px + env(safe-area-inset-bottom));max-width:760px;width:100%;line-height:1.6}.modalcontent h2{margin:0 0 10px}.modalcontent button{border:0;background:#0751a6;color:white;border-radius:10px;padding:11px 20px;font-weight:700}.small{font-size:.85rem;color:#66758b}.unreadDot{display:inline-block;width:7px;height:7px;background:#1671d5;border-radius:50%;margin-left:6px;vertical-align:middle} @media(min-width:650px){.cardbutton{grid-template-columns:140px minmax(0,1fr) 22px;min-height:150px;padding:14px}.thumb{width:140px;height:125px}.card h2{font-size:1.1rem}.body{padding:20px 26px}.hero{height:290px}}@media(max-width:375px){.cardbutton{grid-template-columns:95px minmax(0,1fr) 14px;gap:9px}.thumb{width:95px;height:97px}.card h2{font-size:.91rem}.sourcepill{font-size:.64rem}.head{gap:9px;padding-left:13px;padding-right:12px}.emblem{height:36px;width:36px}}
.pushpanel{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:#edf4fc;border:1px solid #d1e2f6;padding:12px;border-radius:13px;margin-bottom:14px;font-size:.85rem}.pushpanel[hidden]{display:none!important}.pushpanel button{border:0;background:#0751a6;color:white;border-radius:10px;padding:10px 13px;font-weight:700}.pushpanel button+button{background:white;color:#0751a6;border:1px solid #a9c8eb}.pushpanel #pushStatus{color:#445b76}
</style>
</head>
<body>
<header><div class="head"><button class="iconbtn" id="back" aria-label="Aftur til tíðindi" hidden></button><span class="emblem" id="emblem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3.5 5v6c0 5.5 3.5 9 8.5 11 5-2 8.5-5.5 8.5-11V5L12 2Z"/><path d="M8 15V9l4 3 4-3v6"/></svg></span><div class="heading">Nýtt frá ráðunum</div><button class="iconbtn" id="rightAction" aria-label="Leita í tíðindum"></button></div><div class="searchrow" id="searchrow" hidden><input id="search" type="search" placeholder="Leita í tíðindum…" aria-label="Leita í tíðindum"></div></header>
<div class="shell"><main id="listView" class="view body"><nav id="filters" class="filters" aria-label="Vel ráð"></nav><div class="summaryline"><strong id="listTitle">Seinastu tíðindi</strong><span id="count">Lesi tíðindi…</span><button id="refresh" type="button" aria-label="Dagfør tíðindi">↻</button></div><div id="pushpanel" class="pushpanel" hidden><button id="pushEnable" type="button">Fá push-fráboðanir</button><button id="pushCopy" type="button" hidden>Kopiera skráseting</button><span id="pushStatus" role="status"></span></div><section id="cards" class="cards" aria-label="Tíðindayvirlit"></section><p class="footnote">Tíðindi frá almennum keldum. Myndir verða bert vístar, um tær eru við í tíðindadátunum. Nýggj tíðindi verða dagførd í GitHub. Push-boð kunnu tendrast á heimaskíggja-appini, eftir at GitHub-uppsetingin er liðug.</p></main><main id="detailView" class="view detail" hidden></main></div>


<script>
'use strict';
const $=id=>document.getElementById(id);
const icons={search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',back:'<path d="m15 18-6-6 6-6"/>',bookmark:'<path d="M6 4h12v17l-6-4-6 4z"/>',home:'<path d="m3 11 9-8 9 8v10h-7v-7h-4v7H3z"/>',folder:'<path d="M3 5h7l2 3h9v12H3z"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6m0-10h.01"/>',external:'<path d="M14 4h6v6m0-6-9 9"/><path d="M19 14v6H4V5h6"/>',picture:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m3 17 6-5 4 3 4-4 4 5"/>'};
function svg(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icons[name]+'</svg>'}
const state={items:[],tab:'news',source:'',search:'',selected:null,searchOpen:false};
function readSet(key){try{return new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{return new Set()}}
const readKey='ministry-check-read-v1',savedKey='ministry-check-saved-v1';
function store(key,s){try{localStorage.setItem(key,JSON.stringify([...s].slice(-1000)))}catch{}}
function toggleSet(key,id){const s=readSet(key);s.has(id)?s.delete(id):s.add(id);store(key,s)}
function create(tag,cl,txt){const n=document.createElement(tag);if(cl)n.className=cl;if(txt!==undefined)n.textContent=txt;return n}
function fmtDate(val){if(!val)return '';const d=new Date(val);return isNaN(d.getTime())?'':new Intl.DateTimeFormat('fo-FO',{day:'numeric',month:'short',year:'numeric'}).format(d)}
// Unknown publication dates stay below dated articles; discovery is not publication.
function publicationDay(x){const value=x.published_at;if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}/.test(value))return '';const day=value.slice(0,10);const d=new Date(day+'T12:00:00Z');return !isNaN(+d)&&d.toISOString().slice(0,10)===day&&day<=new Date().toISOString().slice(0,10)?day:''}
function dateVal(x){return publicationDay(x)||x.found_at||''}
function compareNews(a,b){const ad=publicationDay(a),bd=publicationDay(b);if(ad&&bd){const cmp=bd.localeCompare(ad);if(cmp)return cmp}else if(ad||bd){return ad?-1:1}const discovered=(b.found_at||'').localeCompare(a.found_at||'');return discovered||a.title.localeCompare(b.title,'fo')}
function shownDate(x){return publicationDay(x)?'Útgivið '+fmtDate(publicationDay(x)):'Útgávudagur ókendur'}
function hue(s){let n=0;for(const c of s)n=(n+c.charCodeAt(0))%5;return String(n)}
function sourceShort(s){const map={'Løgmansskrivstovan':'LMS','Mentamálaráðið':'MMR','Fíggjarmálaráðið':'FMR','Heilsu- og orkumálaráðið':'HOMR','Almanna- og bústaðamálaráðið':'ABMR','Uttanríkis- og fiskimálaráðið':'UFMR','Vinnumálaráðið':'VMR','Løgtingið':'Løgtingið','Løgtingsins umboðsmaður':'LUM'};return map[s]||s}
function thumbnail(x,hero=false){const d=create('div',hero?'hero':'thumb');const image=x.image||x.image_url;if(typeof image==='string'&&/^https:\/\//.test(image)){const img=create('img');img.src=image;img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';img.addEventListener('error',()=>{d.replaceChildren();d.innerHTML=svg('picture')});d.append(img)}else{d.innerHTML=svg('picture')}return d}
function drawFilters(){const root=$('filters');root.replaceChildren();const sources=['',...[...new Set(state.items.map(x=>x.source))].sort((a,b)=>a.localeCompare(b,'fo'))];for(const source of sources){const btn=create('button','chip',source?sourceShort(source):'Øll');btn.title=source||'Allar keldur';btn.setAttribute('aria-pressed',String(state.source===source));btn.onclick=()=>{state.source=source;state.tab='news';state.selected=null;draw()};root.append(btn)}}
function visible(){const q=state.search.trim().toLocaleLowerCase();const saved=readSet(savedKey);return state.items.filter(x=>(!state.source||x.source===state.source)&&(state.tab!=='saved'||saved.has(x.id))&&(!q||[x.title,x.summary,x.source].join(' ').toLocaleLowerCase().includes(q)))}
function drawCards(){const root=$('cards');root.replaceChildren();const items=visible();$('count').textContent=items.length+' tíðindi';$('listTitle').textContent=state.tab==='saved'?'Goymd tíðindi':state.source?state.source:'Seinastu tíðindi';if(!items.length){root.append(create('div','empty',state.items.length?'Eingi tíðindi samsvara við valið.':'Enn eru eingi tíðindi í appini.'));return}const read=readSet(readKey);for(const x of items){const card=create('article','card'),btn=create('button','cardbutton');btn.type='button';btn.setAttribute('aria-label','Les '+x.title);btn.append(thumbnail(x));const body=create('div','cardbody');const pill=create('span','sourcepill',x.source);pill.dataset.hue=hue(x.source);body.append(pill);const h=create('h2','',x.title);if(!read.has(x.id))h.append(create('span','unreadDot'));body.append(h);body.append(create('div','when',shownDate(x)));btn.append(body,create('span','arrow','›'));btn.onclick=()=>{state.selected=x.id;const r=readSet(readKey);r.add(x.id);store(readKey,r);draw();window.scrollTo(0,0)};card.append(btn);root.append(card)}}
function drawDetail(x){const root=$('detailView');root.replaceChildren();const pill=create('span','sourcepill',x.source);pill.dataset.hue=hue(x.source);root.append(pill,create('h1','',x.title),create('div','when',shownDate(x)));root.append(thumbnail(x,true));root.append(create('p','',x.summary||'Eingin samandráttur er tøkur.'));const a=create('a','primary');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';a.innerHTML=svg('external');a.append(document.createTextNode('Les alla greinina á upprunasíðuni'));root.append(a);const s=readSet(savedKey),b=create('button','secondary',s.has(x.id)?'Taka úr goymdum':'Goym greinina');b.onclick=()=>{toggleSet(savedKey,x.id);drawDetail(x)};root.append(b)}
function draw(){const x=state.items.find(i=>i.id===state.selected);const detail=!!x;$('listView').hidden=detail;$('detailView').hidden=!detail;$('back').hidden=!detail;$('emblem').hidden=detail;$('rightAction').innerHTML=svg(detail?'bookmark':'search');$('rightAction').setAttribute('aria-label',detail?'Goym ella tak burtur grein':'Leita í tíðindum');$('searchrow').hidden=detail||!state.searchOpen;if(detail){drawDetail(x)}else{drawFilters();drawCards()}}
$('back').innerHTML=svg('back');$('back').onclick=()=>{state.selected=null;draw()};$('rightAction').onclick=()=>{if(state.selected){toggleSet(savedKey,state.selected);draw();return}state.searchOpen=!state.searchOpen;$('searchrow').hidden=!state.searchOpen;if(state.searchOpen)$('search').focus()};$('search').oninput=e=>{state.search=e.target.value;drawCards()};$('refresh').onclick=()=>load();window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.selected){state.selected=null;draw()}}});
async function load(){const label=$('count');label.textContent='Dagføri…';try{const res=await fetch('./feed.json?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data))throw new Error('Invalid feed');state.items=data.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&typeof x.source==='string'&&typeof x.url==='string'&&/^https:\/\//.test(x.url)).sort(compareNews);
    const wanted=new URLSearchParams(location.search).get('article');
    if(wanted && state.items.some(x=>x.id===wanted))state.selected=wanted;
    draw()}catch(e){label.textContent='Kundi ikki lesa tíðindi';if(!state.items.length)$('cards').replaceChildren(create('div','empty','Kundi ikki lesa tíðindi. Kanna internetsambandið og royn aftur.'))}}
let pushKey = '';
const pushPanel=$('pushpanel'), pushStatus=$('pushStatus');
function b64bytes(v){const padded=v.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-v.length%4)%4);const raw=atob(padded);return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function preparePush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
  try{
    const r=await fetch('./push-config.json',{cache:'no-store'});if(!r.ok)return;
    const config=await r.json();if(!config.publicKey)return;
    pushKey=config.publicKey;pushPanel.hidden=false;
    const reg=await navigator.serviceWorker.ready;
    const existing=await reg.pushManager.getSubscription();
    if(existing){$('pushEnable').textContent='Fráboðanir loyvdar';$('pushCopy').hidden=false;pushStatus.textContent='Skrásetingin skal eisini goymast í GitHub Secrets.';}
  }catch(err){console.warn('Push setup unavailable',err)}
}
$('pushEnable').onclick=async()=>{
  if(!pushKey)return;
  try{
    if(Notification.permission==='denied'){pushStatus.textContent='Fráboðanir eru noktaðar í stillingunum á telefonini.';return}
    // Permission request is directly inside the click handler (iOS requirement).
    const permission=await Notification.requestPermission();
    if(permission!=='granted'){pushStatus.textContent='Fráboðanir ikki loyvdar.';return}
    const reg=await navigator.serviceWorker.ready;
    const subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64bytes(pushKey)});
    $('pushEnable').textContent='Fráboðanir loyvdar';$('pushCopy').hidden=false;
    pushStatus.textContent='Trýst á Kopiera skráseting og goym hana sum GitHub Secret.';
  }catch(error){pushStatus.textContent='Kundi ikki skráseta push. Opna appina frá heimaskíggjanum.'}
};
$('pushCopy').onclick=async()=>{
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(!sub){pushStatus.textContent='Eingin skráseting funnin.';return}
  const json=JSON.stringify([sub.toJSON()]);await navigator.clipboard.writeText(json);pushStatus.textContent='Kopierað. Legg upplýsingarnar í GitHub Secret PUSH_SUBSCRIPTIONS_JSON.';
  }catch(error){pushStatus.textContent='Kundi ikki kopiera skrásetingina.'}
};
// Clear the home-screen app badge whenever the app is opened or returns to view.
async function clearHomeScreenBadge(){
  if(document.visibilityState!=='visible')return;
  try{
    if('clearAppBadge' in navigator){
      await navigator.clearAppBadge();
    }else if('setAppBadge' in navigator){
      await navigator.setAppBadge(0);
    }
  }catch(error){console.warn('Could not clear app icon badge',error)}
  if(!('serviceWorker' in navigator))return;
  try{
    const reg=await navigator.serviceWorker.ready;
    const worker=navigator.serviceWorker.controller||reg.active;
    if(worker)worker.postMessage({type:'CLEAR_BADGE'});
  }catch(error){console.warn('Could not reset stored badge count',error)}
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(()=>{
    preparePush();
    clearHomeScreenBadge();
  }).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)clearHomeScreenBadge()});
window.addEventListener('pageshow',()=>clearHomeScreenBadge());
window.addEventListener('focus',()=>clearHomeScreenBadge());
draw();
load();
</script>
</body></html>
